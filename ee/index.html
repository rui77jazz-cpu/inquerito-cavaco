<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#24303a; --muted:#6b7680; --line:#e3ddd1;
    --accent:#2f7d6d; --accent-soft:#e2f1ec; --accent-ink:#ffffff; --warn:#b5543b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
  header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  header.top .in{max-width:640px;margin:0 auto}
  .steptitle{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:800;font-size:15px}
  .steptitle span:last-child{color:var(--muted);font-weight:600;white-space:nowrap}
  .bar{height:8px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
  h1{font-size:26px;line-height:1.2;margin:28px 0 12px}
  h2{font-size:22px;margin:22px 0 4px}
  .lead{color:var(--muted);margin:0 0 18px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .q .label{font-weight:700;margin:0 0 12px}
  .q .hint{font-size:14px;color:var(--muted);margin:-8px 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:46px}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fcfbf8;color:var(--ink)}
  textarea{min-height:76px;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  .follow{margin-top:12px}
  .follow .flabel{font-size:15px;color:var(--muted);margin-bottom:6px}
  .ms{border-top:1px dashed var(--line);padding:12px 0}
  .ms:first-of-type{border-top:0;padding-top:0}
  .ms .mlabel{font-weight:600;margin-bottom:8px}
  .ms .chip{padding:8px 12px;min-height:40px;font-size:15px}
  .intro p{margin:0 0 12px}
  .note{background:var(--accent-soft);border-radius:14px;padding:14px 16px;font-size:15px}
  .check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .check input{width:26px;height:26px;flex:none;accent-color:var(--accent);margin-top:2px}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  nav.bottom .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
  .btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;cursor:pointer;min-height:52px}
  .btn.pri{background:var(--accent);color:#fff}
  .btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);flex:0 0 34%}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:var(--warn);font-weight:700;margin-top:10px}
  .done{text-align:center;padding-top:60px}
  .done .big{font-size:64px}
  [hidden]{display:none!important}
</style>
</head>
<body>

<header class="top" id="top" hidden>
  <div class="in">
    <div class="steptitle"><span id="stepName"></span><span id="stepCount"></span></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<nav class="bottom" id="nav">
  <div class="in">
    <button class="btn sec" id="back" hidden>Voltar</button>
    <button class="btn pri" id="next">Começar</button>
  </div>
</nav>

/* ---------- Estado ---------- */
const KEY = "inq_ee_rascunho_v1";
const params = new URLSearchParams(location.search);
const CODIGO = (params.get("c") || "").slice(0,40);
let A = {};      // respostas
let step = -1;   // -1 = introdução
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) { A = s.A || {}; } } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({A})); } catch(e){} };

const app = document.getElementById("app");
const nextBtn = document.getElementById("next");
const backBtn = document.getElementById("back");
const top = document.getElementById("top");
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* ---------- Componentes ---------- */
function chips(opts, multi, get, set){
  const box = el("div","chips");
  opts.forEach(o=>{
    const b = el("button","chip",o); b.type="button";
    const cur = get();
    b.setAttribute("aria-pressed", multi ? String((cur||[]).includes(o)) : String(cur===o));
    b.onclick = ()=>{
      if (multi){
        let v = [...(get()||[])];
        if (v.includes(o)) v = v.filter(x=>x!==o);
        else {
          // "Nenhum/Ninguém/Nenhuma" exclui as outras
          const excl = ["Nenhum","Nenhuma","Ninguém"];
          if (excl.includes(o)) v = [o]; else v = v.filter(x=>!excl.includes(x)).concat(o);
        }
        set(v.length ? v : undefined);
      } else set(get()===o ? undefined : o);
    };
    box.appendChild(b);
  });
  return box;
}
function textInput(kind, get, set){
  const i = kind==="text" ? el("textarea") : el("input");
  if (kind!=="text") i.type="text";
  i.value = get() || "";
  i.oninput = ()=>{ set(i.value.trim() ? i.value : undefined, true); };
  return i;
}

function renderQ(q){
  const card = el("section","q");
  if (q.t==="check"){
    const lab = el("label","check");
    const c = el("input"); c.type="checkbox"; c.checked = !!A[q.id];
    c.onchange = ()=>{ A[q.id] = c.checked || undefined; save(); };
    lab.append(c, el("span",null,q.l));
    card.appendChild(lab); return card;
  }
  card.appendChild(el("p","label",q.l));
  if (q.h) card.appendChild(el("p","hint",q.h));

  const rerender = ()=>{ save(); card.replaceWith(renderQ(q)); };
  const setMain = (v, typing)=>{ if (v===undefined) delete A[q.id]; else A[q.id]=v; if (typing) save(); else rerender(); };

  if (q.t==="chips" || q.t==="multi"){
    card.appendChild(chips(q.o, q.t==="multi", ()=>A[q.id], setMain));
  } else if (q.t==="text" || q.t==="short"){
    card.appendChild(textInput(q.t, ()=>A[q.id], setMain));
  } else if (q.t==="marcos"){
    const cur = A[q.id] || {};
    q.rows.forEach(r=>{
      const row = el("div","ms"); row.appendChild(el("div","mlabel",r));
      row.appendChild(chips(q.o,false,()=>cur[r],(v)=>{ if(v===undefined) delete cur[r]; else cur[r]=v; A[q.id]=cur; rerender(); }));
      card.appendChild(row);
    });
  }

  // pergunta de seguimento
  if (q.f){
    const v = A[q.id];
    const vals = Array.isArray(v) ? v : (v ? [v] : []);
    const show = q.f.when ? vals.some(x=>q.f.when.includes(x)) : (vals.length && !vals.every(x=>q.f.whenNot.includes(x)));
    const fid = q.id+"_det";
    if (show){
      const f = el("div","follow"); f.appendChild(el("div","flabel",q.f.l));
      const setF = (nv, typing)=>{ if(nv===undefined) delete A[fid]; else A[fid]=nv; if (typing) save(); else rerender(); };
      f.appendChild(q.f.t==="chips" ? chips(q.f.o,false,()=>A[fid],setF) : textInput(q.f.t,()=>A[fid],setF));
      card.appendChild(f);
    }
  }
  return card;
}

/* ---------- Ecrãs ---------- */
function render(){
  app.innerHTML=""; window.scrollTo(0,0);
  if (step===-1){
    top.hidden = true; backBtn.hidden = true; nextBtn.textContent = Object.keys(A).length ? "Continuar" : "Começar";
    const d = el("div","intro");
    d.appendChild(el("h1",null,"Conhecer melhor o seu educando"));
    d.appendChild(el("p",null,"Caro(a) Encarregado(a) de Educação,"));
    d.appendChild(el("p",null,"Este questionário ajuda a escola a conhecer melhor o seu educando: o que gosta, o que faz bem, as suas dificuldades e o seu percurso. Não pedimos nomes."));
    d.appendChild(el("p",null,"A maior parte das respostas é só tocar numa opção. Responda apenas ao que achar importante — pode saltar qualquer pergunta."));
    const n = el("div","note"); n.textContent = "Demora cerca de 10 minutos. As respostas ficam guardadas neste telemóvel até carregar em «Enviar», por isso pode parar e continuar mais tarde. A informação é confidencial e tratada com sigilo profissional.";
    d.appendChild(n);
    app.appendChild(d); return;
  }
  if (step===STEPS.length){
    top.hidden = true; document.getElementById("nav").hidden = true;
    const d = el("div","done");
    d.appendChild(el("div","big","💚"));
    d.appendChild(el("h1",null,"Muito obrigado!"));
    d.appendChild(el("p","lead","As suas respostas foram enviadas ao professor. Já pode fechar esta página."));
    app.appendChild(d); return;
  }
  const s = STEPS[step];
  top.hidden = false; backBtn.hidden = false;
  document.getElementById("stepName").textContent = s.title;
  document.getElementById("stepCount").textContent = `${step+1} de ${STEPS.length}`;
  document.getElementById("barFill").style.width = ((step+1)/STEPS.length*100)+"%";
  nextBtn.textContent = step===STEPS.length-1 ? "Enviar respostas" : "Seguinte";
  app.appendChild(el("h2",null,s.title));
  if (s.lead) app.appendChild(el("p","lead",s.lead));
  s.qs.forEach(q=>app.appendChild(renderQ(q)));
  app.appendChild(el("div","err")).id="err";
}

/* ---------- Envio para o Firebase ---------- */
function resumo(){
  // lista legível: secção, pergunta, resposta
  const out = [];
  STEPS.forEach(s=>s.qs.forEach(q=>{
    let v = A[q.id];
    if (q.t==="marcos" && v) v = Object.entries(v).map(([k,x])=>`${k}: ${x}`).join("; ");
    if (Array.isArray(v)) v = v.join(", ");
    if (q.t==="check") v = v ? "Sim" : undefined;
    const det = A[q.id+"_det"];
    if (v===undefined && det===undefined) return;
    out.push({ seccao:s.title, pergunta:q.l, resposta: [v, det].filter(Boolean).join(" — ") });
  }));
  return out;
}

async function enviar(){
  if (firebaseConfig.apiKey.startsWith("COLE")) throw new Error("Falta colar a configuração do Firebase no ficheiro.");
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getFirestore, collection, addDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const db = getFirestore(initializeApp(firebaseConfig));
  await addDoc(collection(db, COLECAO), {
    enviadoEm: serverTimestamp(),
    codigo: CODIGO,
    respostas: resumo(),
    dados: JSON.parse(JSON.stringify(A))
  });
}

nextBtn.onclick = async ()=>{
  if (step === STEPS.length-1){
    const err = document.getElementById("err");
    if (!A.declaro){ err.textContent = "Falta confirmar a declaração (última caixa)."; return; }
    nextBtn.disabled = true; backBtn.disabled = true; nextBtn.textContent = "A enviar…"; err.textContent = "";
    try {
      await enviar();
      try { localStorage.removeItem(KEY); } catch(e){}
      step++; render();
    } catch(e){
      err.textContent = "Não foi possível enviar. Verifique a ligação à internet e tente de novo. ("+e.message+")";
      nextBtn.disabled = false; backBtn.disabled = false; nextBtn.textContent = "Enviar respostas";
    }
    return;
  }
  step++; render();
};
backBtn.onclick = ()=>{ if (step>-1){ step--; render(); } };
render();
</script>
